<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 320" width="1440" height="320">

<defs>
    <!-- Background ink night gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#070a12"/>
        <stop offset="50%" stop-color="#0f1726"/>
        <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <!-- Mountain gradients (ink wash layers) -->
    <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a3d54" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#0c131f" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="mtnMid" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1f2d3e" stop-opacity="0.75"/>
        <stop offset="100%" stop-color="#0a1018" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#121b27" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#060910" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fffef0" stop-opacity="0.95"/>
        <stop offset="55%" stop-color="#faecc5" stop-opacity="0.7"/>
        <stop offset="80%" stop-color="#dfcf9f" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="#dfcf9f" stop-opacity="0"/>
    </radialGradient>

    <!-- Red Seal Gradient (Chu Sa) -->
    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#cf3030"/>
        <stop offset="100%" stop-color="#8a1717"/>
    </linearGradient>

    <!-- Golden text gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#dfb76c"/>
        <stop offset="50%" stop-color="#fff6d6"/>
        <stop offset="100%" stop-color="#dfb76c"/>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- Moon Halo -->
    <filter id="moonHalo" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="15" result="glow"/>
        <feMerge>
            <feMergeNode in="glow"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
</defs>

<!-- 1. Background Canvas -->
<rect width="1440" height="320" fill="url(#bgGrad)"/>

<!-- 2. Traditional Rice Paper Texture / Subtle Stars -->
<g opacity="0.4">
    <circle cx="120" cy="50" r="1" fill="#dfd0b5"/>
    <circle cx="280" cy="70" r="1.5" fill="#dfd0b5">
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="40" r="1" fill="#dfd0b5"/>
    <circle cx="950" cy="60" r="1.5" fill="#dfd0b5">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="45" r="1" fill="#dfd0b5"/>
    <circle cx="1300" cy="80" r="1.2" fill="#dfd0b5"/>
    <circle cx="650" cy="75" r="1" fill="#dfd0b5"/>
</g>

<!-- 3. Giant Luminous Moon (Vầng Trăng Cổ Tự) -->
<g transform="translate(1120, 110)">
    <circle cx="0" cy="0" r="75" fill="url(#moonGlow)" filter="url(#moonHalo)">
        <animate attributeName="opacity" values="0.88;0.98;0.88" dur="6s" repeatCount="indefinite"/>
    </circle>
</g>

<!-- 4. Layer 3: Distant Ink Mountains (Núi xa mờ ảo) -->
<path d="M0 320 L0 180 Q160 140 320 175 T640 160 T960 185 T1280 155 Q1360 165 1440 180 L1440 320 Z"
      fill="url(#mtnFar)"/>

<!-- 5. Layer 2: Mid-range Majestic Peaks (Dãy núi thủy mặc trung cảnh) -->
<path d="M0 320 L0 215 Q120 160 250 200 T520 190 T820 220 T1150 180 Q1300 200 1440 225 L1440 320 Z"
      fill="url(#mtnMid)"/>

<!-- 6. Layer 1: Foreground Rocky Silhouette (Vách đá tiền cảnh sắc nét) -->
<path d="M0 320 L0 260 Q180 230 380 270 T850 250 T1250 270 Q1350 255 1440 275 L1440 320 Z"
      fill="url(#mtnNear)"/>

<!-- 7. Ink Wash Mist / Clouds (Dải sương khói bồng bềnh) -->
<g opacity="0.35">
    <path d="M-200 240 Q100 210 400 240 T1000 230 T1600 240 L1600 280 L-200 280 Z" fill="#203045">
        <animateTransform attributeName="transform" type="translate"
            values="-100,0; 100,0; -100,0" dur="20s" repeatCount="indefinite"/>
    </path>
    <path d="M-200 270 Q200 250 600 270 T1200 260 T1800 270 L1800 320 L-200 320 Z" fill="#131c28">
        <animateTransform attributeName="transform" type="translate"
            values="80,0; -80,0; 80,0" dur="25s" repeatCount="indefinite"/>
    </path>
</g>

<!-- 8. Solitary Pine / Bamboo Silhouette (Cành Trúc & Tùng bách cổ phong) -->
<g transform="translate(40, 20)" opacity="0.85">
    <!-- Main branch -->
    <path d="M-40 0 Q60 50 120 40 T220 80 Q180 110 140 100" fill="none" stroke="#0a121a" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 40 Q160 20 210 25" fill="none" stroke="#0a121a" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 45 Q90 90 120 120" fill="none" stroke="#0a121a" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Pine needles / Bamboo leaves clusters -->
    <g fill="#0a121a">
        <ellipse cx="210" cy="25" rx="22" ry="7" transform="rotate(-15 210 25)"/>
        <ellipse cx="225" cy="28" rx="18" ry="6" transform="rotate(10 225 28)"/>
        <ellipse cx="220" cy="80" rx="25" ry="8" transform="rotate(25 220 80)"/>
        <ellipse cx="235" cy="85" rx="20" ry="7" transform="rotate(-5 235 85)"/>
        <ellipse cx="120" cy="120" rx="20" ry="6" transform="rotate(45 120 120)"/>
        <ellipse cx="135" cy="125" rx="16" ry="5" transform="rotate(20 135 125)"/>
    </g>
</g>

<!-- 9. Flying Immortal Cranes (Đôi Tiên Hạc Lướt Gió) -->
<!-- Crane 1 -->
<g opacity="0.9">
    <path d="M0 0 Q10 -6 16 -3 Q20 3 14 6 Q8 4 0 0 Z M6 -1 Q-5 -12 -12 -18 Q-8 -6 0 1 Z M6 2 Q-4 12 -10 20 Q-7 8 2 3 Z M16 -3 L24 -4 L16 -2 Z"
          fill="#fbf9f0">
        <animateMotion path="M 1250 80 Q 950 40 680 75 T 150 90" dur="18s" repeatCount="indefinite"/>
    </path>
</g>
<!-- Crane 2 (Smaller follower) -->
<g opacity="0.75" transform="scale(0.7)">
    <path d="M0 0 Q10 -6 16 -3 Q20 3 14 6 Q8 4 0 0 Z M6 -1 Q-5 -12 -12 -18 Q-8 -6 0 1 Z M6 2 Q-4 12 -10 20 Q-7 8 2 3 Z M16 -3 L24 -4 L16 -2 Z"
          fill="#fbf9f0">
        <animateMotion path="M 1320 115 Q 1020 75 750 110 T 220 125" dur="18s" repeatCount="indefinite"/>
    </path>
</g>

<!-- 10. Drifting Peach Petals (Cánh Hoa Đào Bay Lượn) -->
<g fill="#f87171" opacity="0.75">
    <!-- Petal 1 -->
    <path d="M0 0 C4 -3 8 -1 7 4 C6 8 1 9 -1 6 C-3 3 -2 1 0 0 Z">
        <animateMotion path="M 200 30 Q 500 180 800 280 T 1400 320" dur="12s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Petal 2 -->
    <path d="M0 0 C3 -2 6 -1 5 3 C4 6 1 7 -1 5 C-2 2 -1 1 0 0 Z">
        <animateMotion path="M 100 90 Q 400 220 700 290 T 1300 340" dur="15s" repeatCount="indefinite" begin="2s"/>
        <animateTransform attributeName="transform" type="rotate" values="360;0" dur="5s" repeatCount="indefinite"/>
    </path>
    <!-- Petal 3 -->
    <path d="M0 0 C4 -2 7 0 6 4 C5 7 1 8 0 5 C-1 3 0 1 0 0 Z">
        <animateMotion path="M 400 20 Q 700 150 1000 270 T 1500 320" dur="14s" repeatCount="indefinite" begin="4s"/>
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="6s" repeatCount="indefinite"/>
    </path>
</g>

<!-- 11. Traditional Border Corners (Góc Cung Đình) -->
<g stroke="#dfb76c" stroke-width="1.8" fill="none" opacity="0.65">
    <path d="M 25 45 L 25 25 L 45 25 M 32 25 L 32 38 L 45 38"/>
    <path d="M 1415 45 L 1415 25 L 1395 25 M 1408 25 L 1408 38 L 1395 38"/>
    <path d="M 25 275 L 25 295 L 45 295 M 32 295 L 32 282 L 45 282"/>
    <path d="M 1415 275 L 1415 295 L 1395 295 M 1408 295 L 1408 282 L 1395 282"/>
</g>

<!-- 12. Centerpiece: Red Cinnabar Seal & Modern Classical Typography -->
<g transform="translate(720, 150)">
    
    <!-- Red Seal Stamp (Chu Sa Ấn với Chữ H Cách Điệu) -->
    <g transform="translate(-230, -36)">
        <rect x="0" y="0" width="60" height="60" rx="6" fill="url(#sealGrad)" filter="url(#softGlow)"/>
        <!-- Inner carved border -->
        <rect x="4" y="4" width="52" height="52" rx="4" fill="none" stroke="#ffcccc" stroke-width="1.5" opacity="0.8"/>
        <!-- Monogram: 'H' in classical serif style -->
        <text x="30" y="41" font-family="'Cinzel', 'Georgia', serif"
              font-size="32" font-weight="900" fill="#fff5f5" text-anchor="middle">
            H
        </text>
        <circle cx="13" cy="15" r="1.5" fill="#8a1717" opacity="0.4"/>
        <circle cx="47" cy="45" r="1.5" fill="#8a1717" opacity="0.4"/>
    </g>

    <!-- Main Title: Name in Majestic Gold -->
    <text x="-145" y="-6"
          font-family="'Cinzel', 'Georgia', serif"
          font-size="34" font-weight="700" letter-spacing="6"
          fill="url(#goldGrad)" filter="url(#softGlow)">
        HƯNG ĐÀO  •  NEQQIPY
    </text>

    <!-- Subtitle: Clean English Role & Institution -->
    <text x="-140" y="24"
          font-family="'Cinzel', 'Georgia', serif"
          font-size="13" font-weight="600" letter-spacing="4" fill="#dfb76c" opacity="0.9">
        SOFTWARE CRAFTSMAN  //  SYSTEMS ARCHITECT
    </text>

    <!-- Tagline: Philosophical Quote -->
    <text x="-140" y="46"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-style="italic" letter-spacing="1" fill="#a5b9d0" opacity="0.85">
        "Quiet focus in code, boundless horizons in craft."
    </text>

</g>

<!-- 13. Subtle Border Outline -->
<rect width="1440" height="320" fill="none" stroke="#253549" stroke-width="1" opacity="0.4"/>

</svg>